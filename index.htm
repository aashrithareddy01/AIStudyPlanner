<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Study Planner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(to right,#141e30,#243b55);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:white;
}

.container{
    width:100%;
    max-width:750px;
    background:rgba(255,255,255,0.1);
    padding:30px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#00c6ff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0072ff;
}

.output{
    margin-top:25px;
    background:rgba(255,255,255,0.15);
    padding:20px;
    border-radius:15px;
}

.day-card{
    margin-top:15px;
    padding:12px;
    background:rgba(0,0,0,0.2);
    border-radius:10px;
}

.progress-container{
    width:100%;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin:10px 0;
}

.progress-bar{
    height:25px;
    background:#00c6ff;
    color:white;
    text-align:center;
    line-height:25px;
    font-weight:bold;
    width:0%;
    transition:0.5s;
}

#progressText{
    margin-top:10px;
    font-weight:bold;
}

.complete-btn{
    margin-top:15px;
    background:#28a745;
}

.complete-btn:hover{
    background:#218838;
}

</style>
</head>

<body>

<div class="container">

    <h1> AI Study Planner</h1>

    <label>Enter Subjects</label>
    <input type="text" id="subjects" placeholder="DBMS,ML,CD">

    <label>Weak Subject</label>
    <input type="text" id="weakSubject" placeholder="CD">

    <label>Exam Date</label>
    <input type="date" id="examDate">

    <button onclick="createStudyPlan()">
        Generate Study Plan
    </button>

    <div class="output" id="result">
        Your timetable will appear here...
    </div>

</div>

<script>

let totalDays = 0;
let completedDays = 0;

function createStudyPlan(){

    let subjectList = document
        .getElementById("subjects")
        .value
        .split(",");

    let weakSubject = document
        .getElementById("weakSubject")
        .value
        .trim()
        .toLowerCase();

    let examDate = new Date(
        document.getElementById("examDate").value
    );

    let today = new Date();

    let remainingDays = Math.ceil(
        (examDate - today) / (1000*60*60*24)
    );

    let resultBox = document.getElementById("result");

    if(remainingDays <= 0){
        resultBox.innerHTML =
        "⚠ Please select a future exam date.";
        return;
    }

    totalDays = remainingDays;
    completedDays = 0;

    let studyTips = [
        "Revise important concepts.",
        "Practice previous year papers.",
        "Take short notes.",
        "Focus on weak topics.",
        "Solve MCQs today.",
        "Take breaks while studying."
    ];

    let studyPlan = `
        <h2> Your AI Study Plan</h2>
        <p><strong>Days Left:</strong> ${remainingDays}</p>

        <h3>Progress Tracker</h3>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                0%
            </div>
        </div>

        <p id="progressText">
            Completed Days: 0 / ${totalDays}
        </p>

        <button class="complete-btn"
                onclick="markCompleted()">
            ✔ Mark Day Completed
        </button>
    `;

    for(let day = 1; day <= remainingDays; day++){

        let currentSubject =
        subjectList[day % subjectList.length].trim();

        let studyHours = "2-3 Hours";

        if(remainingDays <= 7){
            studyHours = "3-4 Hours";
        }

        if(remainingDays <= 3){
            studyHours = "4-5 Hours";
        }

        let suggestion = "";

        if(currentSubject.toLowerCase() === weakSubject){
            suggestion =
            "Extra attention required for this subject.";
        }
        else{
            suggestion =
            studyTips[Math.floor(
                Math.random()*studyTips.length
            )];
        }

        studyPlan += `
        <div class="day-card">
            <h3>Day ${day}</h3>

            <p>
                <strong>Subject:</strong>
                ${currentSubject}
            </p>

            <p>
                <strong>Study Time:</strong>
                ${studyHours}
            </p>

            <p>
                <strong>AI Suggestion:</strong>
                ${suggestion}
            </p>
        </div>
        `;
    }

    resultBox.innerHTML = studyPlan;
}

function markCompleted(){

    if(completedDays < totalDays){

        completedDays++;

        let percentage =
        Math.round(
            (completedDays / totalDays) * 100
        );

        document.getElementById("progressBar")
        .style.width = percentage + "%";

        document.getElementById("progressBar")
        .innerHTML = percentage + "%";

        document.getElementById("progressText")
        .innerHTML =
        `Completed Days: ${completedDays} / ${totalDays}`;
    }
}

</script>

</body>
</html>
